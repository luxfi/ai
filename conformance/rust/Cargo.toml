[package]
name = "lux-ai-conformance"
version = "0.1.0"
edition = "2021"
description = "Native Rust impl of luxfi/ai reward/receipt math, proven identical to the Go reference via shared golden vectors (../vectors.json). Seed for the hanzod Rust port."

[lib]
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
